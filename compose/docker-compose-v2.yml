version: '3.9'

x-base_service: &base_service
    hostname: ifr
    volumes:
      - &models ../models:/models
      - &app ../if_rest:/app/if_rest
      - &entrypoint ../entrypoint.sh:/app/entrypoint.sh
      - &v_nginx ../misc/nginx_conf/conf.d:/etc/nginx/conf.d
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Must exceed model download + TRT engine warmup on first boot, otherwise
      # the container is killed mid-startup and never reaches "healthy".
      start_period: 240s

services:
  ifr-trt-gpu0:
    <<: *base_service
    profiles: ['gpu', 'mgpu']
    image: insightface-rest:${IFR_VERSION}
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile_trt
    ports:
      - "18081:18080"
    env_file:
      - .env
    volumes:
      - *app
      - *entrypoint
      - *models
      # Persist ONNX weights + compiled TRT engines across deploys (see notes
      # in docker-compose.yml). Prevents re-download/re-compile on every redeploy.
      - ifr_onnx:/models/onnx
      - ifr_trt_engines:/models/trt-engines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  ifr-trt-gpu1:
    <<: *base_service
    profiles: ['mgpu']
    image: insightface-rest:${IFR_VERSION}
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile_trt
    env_file:
      - .env
    volumes:
      - *app
      - *entrypoint
      - *models
      # Persist ONNX weights + compiled TRT engines across deploys (see notes
      # in docker-compose.yml). Prevents re-download/re-compile on every redeploy.
      - ifr_onnx:/models/onnx
      - ifr_trt_engines:/models/trt-engines
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]


  ifr-cpu:
    <<: *base_service
    profiles: ['cpu']
    image: insightface-rest:${IFR_VERSION}-cpu
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile_cpu
    ports:
      - "18081:18080"
    env_file:
      - cpu.env
    volumes:
      - *app
      - *entrypoint
      - *models
      # Persist ONNX weights + compiled TRT engines across deploys (see notes
      # in docker-compose.yml). Prevents re-download/re-compile on every redeploy.
      - ifr_onnx:/models/onnx
      - ifr_trt_engines:/models/trt-engines

  nginx:
    profiles: ['mgpu']
    image: nginx:1.21.0-alpine
    container_name: nginx-ifr
    volumes:
      - *v_nginx
    ports:
      - 18080:18080
    depends_on:
      - ifr-trt-gpu0
    ulimits:
      nofile:
        soft: 200000
        hard: 200000

volumes:
  ifr_onnx:
  ifr_trt_engines:


