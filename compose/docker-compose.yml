services:
  ifr-trt-gpu0:
    image: insightface-rest:${IFR_VERSION}
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile_trt
    hostname: ifr
    env_file:
      - .env
    volumes:
      - ../models:/models
      - ../if_rest:/app/if_rest
      - ../entrypoint.sh:/app/entrypoint.sh
      - ../misc/test_images:/images/test_images
    ports:
      - 18081:18080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Must exceed model download + TRT engine warmup on first boot, otherwise
      # the container is killed mid-startup and never reaches "healthy".
      start_period: 240s
